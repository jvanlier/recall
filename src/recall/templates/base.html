<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#315c8c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/icon-192.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='katex.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
    <title>{% block title %}recall{% endblock %}</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('deck_list') }}">recall</a>
      {% block header_actions %}{% endblock %}
    </header>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='katex.min.js') }}"></script>
    <script src="{{ url_for('static', path='contrib/auto-render.min.js') }}"></script>
    <script src="{{ url_for('static', path='app.js') }}"></script>
  </body>
</html>

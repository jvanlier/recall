[project]
name = "recall"
version = "0.1.0"
description = "A personal spaced repetition web app for markdown cards."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fsrs>=6,<7",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.19",
]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]
